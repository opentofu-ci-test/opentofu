pipeline:
  id: pipeline_opentofu_ci_test_opentofu_build_dfe1
  name: pipeline_opentofu_ci_test_opentofu_build_dfe1
  stages:
    - id: build_and_test
      name: Build and Test
      runtime:
        cloud: {}
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          template:
            uses: setupGo@1.0.1
            with:
              version: 1.21.3
        - name: Install Dependencies
          id: install_deps
          run:
            shell: bash
            script: |-
              go version
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go mod download
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go build ./...
        - name: Unit Tests
          id: unit_tests
          run:
            shell: bash
            script: |-
              mkdir -p .harness/reports .harness/coverage
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0
              set +e
              go test -coverprofile=.harness/coverage/coverage.out ./... 2>&1 | tee .harness/reports/go-test.log
              test_status=${PIPESTATUS[0]}
              "$(go env GOPATH)/bin/go-junit-report" -set-exit-code < .harness/reports/go-test.log > .harness/reports/junit.xml
              report_status=$?
              set -e
              if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
              exit "$report_status"
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/coverage.out"
              hcli cov upload --file=".harness/coverage/coverage.out"
  tags:
    onboarding: "true"
